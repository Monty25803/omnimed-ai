apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinical
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: clinical }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diagnostics
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: diagnostics }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ai }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { tier: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
spec:
  minAvailable: 1
  selector:
    matchExpressions:
      - { key: tier, operator: In, values: [web, gateway] }

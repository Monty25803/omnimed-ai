apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web, tier: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: omnimed/web
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: COOKIE_SECURE, value: "true" }
            - name: GATEWAY_URL
              valueFrom: { configMapKeyRef: { name: omnimed-config, key: GATEWAY_URL } }
            - name: KEYCLOAK_URL
              valueFrom: { configMapKeyRef: { name: omnimed-config, key: KEYCLOAK_URL } }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ name: http, port: 3000, targetPort: http }]

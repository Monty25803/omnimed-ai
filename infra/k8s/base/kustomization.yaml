apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnimed
labels:
  - pairs:
      app.kubernetes.io/part-of: omnimed
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - clinical.yaml
  - diagnostics.yaml
  - lifesciences.yaml
  - ai.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - autoscaling.yaml
images:
  - name: omnimed/clinical
    newName: ghcr.io/omnimed/clinical
    newTag: "0.1.0"
  - name: omnimed/diagnostics
    newName: ghcr.io/omnimed/diagnostics
    newTag: "0.1.0"
  - name: omnimed/lifesciences
    newName: ghcr.io/omnimed/lifesciences
    newTag: "0.1.0"
  - name: omnimed/ai
    newName: ghcr.io/omnimed/ai
    newTag: "0.1.0"
  - name: omnimed/web
    newName: ghcr.io/omnimed/web
    newTag: "0.1.0"

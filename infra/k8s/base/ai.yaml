apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels: { app: ai, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai }
  template:
    metadata:
      labels: { app: ai, tier: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: omnimed/ai
          ports: [{ name: http, containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: omnimed-config }
            - secretRef: { name: omnimed-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector: { app: ai }
  ports: [{ name: http, port: 8084, targetPort: http }]

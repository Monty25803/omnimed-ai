apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifesciences
  labels: { app: lifesciences, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lifesciences }
  template:
    metadata:
      labels: { app: lifesciences, tier: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lifesciences
          image: omnimed/lifesciences
          ports: [{ name: http, containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: omnimed-config }
            - secretRef: { name: omnimed-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lifesciences
spec:
  selector: { app: lifesciences }
  ports: [{ name: http, port: 8083, targetPort: http }]

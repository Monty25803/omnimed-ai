apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical
  labels: { app: clinical, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: clinical }
  template:
    metadata:
      labels: { app: clinical, tier: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: clinical } }
      containers:
        - name: clinical
          image: omnimed/clinical
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: PORT, value: "8081" }
          envFrom:
            - configMapRef: { name: omnimed-config }
            - secretRef: { name: omnimed-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: clinical
spec:
  selector: { app: clinical }
  ports: [{ name: http, port: 8081, targetPort: http }]
